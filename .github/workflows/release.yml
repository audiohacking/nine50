name: Build Release

on:
  release:
    types: [published]

jobs:
  build-macOS:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j8 --config Release

      - name: Package
        run: |
          cd build/Source/NINE50_artefacts/Release
          zip -r ../NINE50-macOS.zip AU/ VST3/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NINE50-macOS
          path: build/Source/NINE50_artefacts/NINE50-macOS.zip

  build-Windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release -j8

      - name: Package
        run: |
          cd build/Source/NINE50_artefacts/Release
          7z a ../NINE50-Windows.zip VST3/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NINE50-Windows
          path: build/Source/NINE50_artefacts/NINE50-Windows.zip

  create-release:
    name: Create Release Assets
    needs: [build-macOS, build-Windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: NINE50-macOS
          path: ./artifacts

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: NINE50-Windows
          path: ./artifacts

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/NINE50-macOS.zip
            artifacts/NINE50-Windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
