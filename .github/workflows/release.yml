name: Build Release

on:
  release:
    types: [published]

jobs:
  build-macOS:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Cache JUCE FetchContent
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: ${{ runner.os }}-juce-9.0.0-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-juce-9.0.0-

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j8 --config Release

      - name: Package (zip)
        run: |
          cd build/Source/NINE50_artefacts/Release
          zip -r ../../../../NINE50-macOS.zip AU/ VST3/

      - name: Package (installer .pkg)
        run: ./scripts/build-installer-pkg.sh --version ${{ github.event.release.tag_name }}

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: NINE50-macOS
          path: NINE50-macOS.zip

      - name: Upload pkg artifact
        uses: actions/upload-artifact@v4
        with:
          name: NINE50-macOS-Installer
          path: release-artefacts/NINE50-macOS-Installer.pkg

  create-release:
    name: Create Release Assets
    needs: [build-macOS]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download macOS zip
        uses: actions/download-artifact@v4
        with:
          name: NINE50-macOS
          path: ./artifacts

      - name: Download macOS installer
        uses: actions/download-artifact@v4
        with:
          name: NINE50-macOS-Installer
          path: ./artifacts

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/NINE50-macOS.zip
            artifacts/NINE50-macOS-Installer.pkg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
